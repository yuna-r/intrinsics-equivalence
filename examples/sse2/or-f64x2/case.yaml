schema_version: 1
id: sse2.or.f64x2.default
description: bitwise OR across two binary64 lanes

intel:
  symbol: intel_mm_or_pd
  required_isa: [sse2]

openpower:
  symbol: power_mm_or_pd
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: f64, lanes: 2}
    - {name: b, type: vector, element: f64, lanes: 2}
  return: {type: vector, element: f64, lanes: 2}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
