[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "intrinsics-equivalence"
version = "0.1.0"
description = "Intel Intrinsics / OpenPOWER equivalence-test coordinator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "IOITF contributors"}]
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
ioitf = "ioitf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
