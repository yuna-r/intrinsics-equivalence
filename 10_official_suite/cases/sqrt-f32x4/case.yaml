schema_version: 1
id: sse2.sqrt.f32x4.default
description: four-lane IEEE 754 binary32 square root with SSE special-value results

intel:
  symbol: intel_mm_sqrt_ps
  required_isa: [sse2]

openpower:
  symbol: power_mm_sqrt_ps
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: f32, lanes: 4}
  return: {type: vector, element: f32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [nan-sensitive, signed-zero-sensitive]
