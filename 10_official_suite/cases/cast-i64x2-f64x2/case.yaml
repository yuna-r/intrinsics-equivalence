schema_version: 1
id: sse2.cast.i64x2.f64x2
description: reinterpret 128 integer bits as two binary64 lanes without conversion

intel:
  symbol: intel_mm_castsi128_pd
  required_isa: [sse2]

openpower:
  symbol: power_mm_castsi128_pd
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i64, lanes: 2}
  return: {type: vector, element: f64, lanes: 2}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
