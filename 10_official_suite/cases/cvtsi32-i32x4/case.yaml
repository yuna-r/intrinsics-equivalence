schema_version: 1
id: sse2.cvtsi32.i32x4.default
description: place one signed 32-bit scalar in the low lane and clear the remaining lanes

intel:
  symbol: intel_mm_cvtsi32_si128
  required_isa: [sse2]

openpower:
  symbol: power_mm_cvtsi32_si128
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: value, type: scalar, element: i32}
  return: {type: vector, element: i32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
