schema_version: 1
id: sse2.extract.i16x8.imm8
description: extract one unsigned 16-bit lane selected by an immediate

intel:
  symbol: intel_mm_extract_epi16
  required_isa: [sse2]

openpower:
  symbol: power_mm_extract_epi16
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i16, lanes: 8}
    - {name: imm8, type: immediate, element: u8}
  return: {type: scalar, element: u32}

immediates:
  imm8:
    values: [0, 1, 2, 3, 4, 5, 6, 7]
    compile_time: true

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
