schema_version: 1
id: sse2.cvt.i32x4.f64x2
description: convert the low two signed 32-bit lanes to exact binary64 values

intel:
  symbol: intel_mm_cvtepi32_pd
  required_isa: [sse2]

openpower:
  symbol: power_mm_cvtepi32_pd
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i32, lanes: 4}
  return: {type: vector, element: f64, lanes: 2}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
