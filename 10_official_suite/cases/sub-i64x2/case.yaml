schema_version: 1
id: sse2.sub.i64x2.default
description: subtract two signed 64-bit lanes with modulo-2^64 wrapping

intel:
  symbol: intel_mm_sub_epi64
  required_isa: [sse2]

openpower:
  symbol: power_mm_sub_epi64
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i64, lanes: 2}
    - {name: b, type: vector, element: i64, lanes: 2}
  return: {type: vector, element: i64, lanes: 2}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
