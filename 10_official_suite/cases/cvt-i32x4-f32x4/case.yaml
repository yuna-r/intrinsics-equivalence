schema_version: 1
id: sse2.cvt.i32x4.f32x4
description: convert four signed 32-bit lanes to nearest-even binary32 values

intel:
  symbol: intel_mm_cvtepi32_ps
  required_isa: [sse2]

openpower:
  symbol: power_mm_cvtepi32_ps
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i32, lanes: 4}
  return: {type: vector, element: f32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
