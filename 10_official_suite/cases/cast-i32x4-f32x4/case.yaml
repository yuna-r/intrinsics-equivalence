schema_version: 1
id: sse2.cast.i32x4.f32x4
description: reinterpret the full 128-bit payload from i32 lanes to f32 lanes

intel:
  symbol: intel_mm_castsi128_ps
  required_isa: [sse2]

openpower:
  symbol: power_mm_castsi128_ps
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i32, lanes: 4}
  return: {type: vector, element: f32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
