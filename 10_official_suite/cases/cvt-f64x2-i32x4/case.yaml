schema_version: 1
id: sse2.cvt.f64x2.i32x4
description: round two binary64 lanes to signed 32-bit integers and zero the high lanes

intel:
  symbol: intel_mm_cvtpd_epi32
  required_isa: [sse2]

openpower:
  symbol: power_mm_cvtpd_epi32
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: f64, lanes: 2}
  return: {type: vector, element: i32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
