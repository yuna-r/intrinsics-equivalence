schema_version: 1
id: sse2.packus.i16x8.default
description: pack two signed 16-bit vectors into unsigned 8-bit lanes with saturation

intel:
  symbol: intel_mm_packus_epi16
  required_isa: [sse2]

openpower:
  symbol: power_mm_packus_epi16
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i16, lanes: 8}
    - {name: b, type: vector, element: i16, lanes: 8}
  return: {type: vector, element: u8, lanes: 16}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
