schema_version: 1
id: sse2.setr.i32x4.low-high
description: construct four signed 32-bit lanes supplied low to high

intel:
  symbol: intel_mm_setr_epi32
  required_isa: [sse2]

openpower:
  symbol: power_mm_setr_epi32
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: lane0, type: scalar, element: i32}
    - {name: lane1, type: scalar, element: i32}
    - {name: lane2, type: scalar, element: i32}
    - {name: lane3, type: scalar, element: i32}
  return: {type: vector, element: i32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
