schema_version: 1
id: sse2.set.i64x2.high-low
description: construct a vector from explicit scalar lanes supplied high to low

intel:
  symbol: intel_mm_set_epi64
  required_isa: [sse2]

openpower:
  symbol: power_mm_set_epi64
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: lane1, type: scalar, element: i64}
    - {name: lane0, type: scalar, element: i64}
  return: {type: vector, element: i64, lanes: 2}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
