schema_version: 1
id: sse2.cmpeq.i32x4.default
description: compare four signed 32-bit lanes for equality

intel:
  symbol: intel_mm_cmpeq_epi32
  required_isa: [sse2]

openpower:
  symbol: power_mm_cmpeq_epi32
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i32, lanes: 4}
    - {name: b, type: vector, element: i32, lanes: 4}
  return: {type: vector, element: i32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
