schema_version: 1
id: sse2.sll.i64x2.vector-count
description: left shift using the low 64-bit lane of a vector count

intel:
  symbol: intel_mm_sll_epi64
  required_isa: [sse2]

openpower:
  symbol: power_mm_sll_epi64
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i64, lanes: 2}
    - {name: count, type: vector, element: u64, lanes: 2}
  return: {type: vector, element: i64, lanes: 2}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
