schema_version: 1
id: sse2.add.f32x4.default
description: four-lane IEEE 754 binary32 addition

intel:
  symbol: intel_mm_add_ps
  required_isa: [sse2]

openpower:
  symbol: power_mm_add_ps
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: f32, lanes: 4}
    - {name: b, type: vector, element: f32, lanes: 4}
  return: {type: vector, element: f32, lanes: 4}

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
