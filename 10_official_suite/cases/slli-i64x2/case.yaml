schema_version: 1
id: sse2.slli.i64x2.imm8
description: logical left shift of two 64-bit lanes using an imm8 count

intel:
  symbol: intel_mm_slli_epi64
  required_isa: [sse2]

openpower:
  symbol: power_mm_slli_epi64
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: i64, lanes: 2}
    - {name: imm8, type: immediate, element: u8}
  return: {type: vector, element: i64, lanes: 2}

immediates:
  imm8:
    values: [0, 1, 31, 63, 64, 255]
    compile_time: true

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: []
