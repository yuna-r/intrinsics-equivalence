schema_version: 1
id: sse2.shuffle.f32x4.imm8
description: select two binary32 lanes from each source using an imm8 control

intel:
  symbol: intel_mm_shuffle_ps
  required_isa: [sse2]

openpower:
  symbol: power_mm_shuffle_ps
  required_isa: [power8, vsx]

signature:
  arguments:
    - {name: a, type: vector, element: f32, lanes: 4}
    - {name: b, type: vector, element: f32, lanes: 4}
    - {name: imm8, type: immediate, element: u8}
  return: {type: vector, element: f32, lanes: 4}

immediates:
  imm8:
    values: [0, 27, 78, 177, 228, 255]
    compile_time: true

input_domain:
  exclude: []

comparison:
  mode: bit_exact

environment:
  fp_rounding_modes: [nearest_even]
  observe_fp_exceptions: false

tags: [endianness-sensitive]
